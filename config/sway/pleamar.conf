# pleamar: биндинги оболочки (подключается из ~/.config/sway/config).
#
# Super (одиночный) — центр управления. Super+D и Super+V сами гасят
# отпускание Super, чтобы центр не открылся поверх лончера и буфера.
# Сцены стартуют из ~/.config/pleamar/autostart.

exec pleamar --autostart

bindsym --no-repeat --release Super_L exec pleamar --say center "emit toggle"
bindsym --no-repeat --to-code $mod+d exec pleamar --say launcher "emit toggle"
bindsym --no-repeat --to-code $mod+v exec pleamar --say clipboard "emit toggle"
